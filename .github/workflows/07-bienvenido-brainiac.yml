name: 🤖 Bienvenida de Brainiac - Nuevo Issue

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  responder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Brainiac confirma la recepción
        uses: actions/github-script@v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `¡Saludos, @${context.payload.issue.user.login}!

              🧠 Tu issue ha sido registrado en mi banco de datos y está siendo revisado por Brainiac.

              **Issue:** #${context.issue.number}
              **Título:** ${context.payload.issue.title}

              Mi intelecto de nivel 12 procesará tu solicitud en breve.`
            });

      - name: Brainiac informa al cuartel por correo
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Nuevo issue #${{ github.event.issue.number }} registrado por Brainiac
          to: malweration@gmail.com
          from: Brainiac <${{ secrets.SMTP_USERNAME }}>
          body: |
            Brainiac ha registrado un nuevo issue en su banco de datos.

            Issue: #${{ github.event.issue.number }}
            Título: ${{ github.event.issue.title }}
            Autor: ${{ github.event.issue.user.login }}
            URL: ${{ github.event.issue.html_url }}

            Mi intelecto de nivel 12 procesará la solicitud en breve.